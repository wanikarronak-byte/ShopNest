<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register — ShopNest demo store.">
  <title>Register — ShopNest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="ShopNest home">
        <img class="brand-logo" src="https://placehold.co/48x48?text=SN" alt="ShopNest logo" width="48" height="48">
        <span class="brand-name">ShopNest</span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html">Home</a></li>
          <li><a href="login.html">Login</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">

    <section class="auth-page" aria-labelledby="register-heading">
      <h1 id="register-heading">Create Account</h1>
      <p class="section-note">
        Registration is a UI demo only. Passwords are not stored securely until you add a real backend.
      </p>

      <p class="form-errors" id="register-errors" role="alert" hidden></p>
      <p class="form-success" id="register-success" role="status" hidden></p>

      <form class="auth-form" id="register-form" action="login.html" method="get" novalidate>

        <p>
          <label for="register-name">Name</label>
          <input type="text" id="register-name" name="name" required autocomplete="name">
        </p>

        <p>
          <label for="register-email">Email</label>
          <input type="email" id="register-email" name="email" required autocomplete="email">
        </p>

        <p>
          <label for="register-password">Password</label>
          <input type="password" id="register-password" name="password" required autocomplete="new-password" minlength="8">
        </p>

        <p>
          <label for="register-confirm-password">Confirm password</label>
          <input type="password" id="register-confirm-password" name="confirm_password" required autocomplete="new-password" minlength="8">
        </p>

        <button type="submit" class="btn btn-primary">Register</button>
      </form>

      <p>
        Already have an account?
        <a href="login.html">Login</a>
      </p>
    </section>

  </main>

  <footer class="site-footer">
    <p class="copyright"><small>&copy; 2026 ShopNest. Demo site.</small></p>
  </footer>

  <script src="js/api.js"></script>
  <script src="script.js"></script>
</body>
</html>
