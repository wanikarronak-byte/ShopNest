<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel — ShopNest</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard-body">
  <div class="dash-layout" id="admin-app">
    <aside class="dash-sidebar" aria-label="Admin navigation">
      <a class="brand dash-brand" href="index.html">
        <span class="brand-name">ShopNest Admin</span>
      </a>
      <nav>
        <button type="button" class="dash-nav-btn is-active" data-view="overview">Dashboard</button>
        <button type="button" class="dash-nav-btn" data-view="products">Products</button>
        <button type="button" class="dash-nav-btn" data-view="pending-products">Pending products</button>
        <button type="button" class="dash-nav-btn" data-view="sellers">Sellers</button>
        <button type="button" class="dash-nav-btn" data-view="customers">Customers</button>
        <button type="button" class="dash-nav-btn" data-view="orders">Orders</button>
        <button type="button" class="dash-nav-btn" data-view="categories">Categories</button>
      </nav>
      <div class="dash-sidebar-foot">
        <p id="admin-user-label" class="dash-user"></p>
        <button type="button" class="btn" id="admin-logout">Log out</button>
        <a class="btn" href="index.html">Storefront</a>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <button type="button" class="btn nav-toggle dash-menu" id="dash-menu">Menu</button>
        <h1 id="dash-title">Dashboard</h1>
      </header>

      <div id="gate-login" class="dash-gate" hidden>
        <section class="auth-page dash-card">
          <h2>Admin login</h2>
          <p class="section-note">Server-verified admin role required. Changing localStorage cannot grant admin access.</p>
          <p class="form-errors" id="admin-login-errors" role="alert" hidden></p>
          <form id="admin-login-form" class="auth-form">
            <p>
              <label for="admin-email">Email</label>
              <input type="email" id="admin-email" required autocomplete="username">
            </p>
            <p>
              <label for="admin-password">Password</label>
              <input type="password" id="admin-password" required autocomplete="current-password">
            </p>
            <button type="submit" class="btn btn-primary">Sign in</button>
          </form>
        </section>
      </div>

      <div id="dash-content" hidden>
        <section data-panel="overview" class="dash-panel is-visible">
          <div class="stat-grid" id="stat-grid"></div>
          <p class="section-note">Totals come from the ShopNest server database.</p>
        </section>

        <section data-panel="products" class="dash-panel">
          <div class="dash-toolbar">
            <h2>All products</h2>
            <button type="button" class="btn btn-primary" id="btn-new-product">Add product</button>
          </div>
          <div class="table-wrap"><table class="dash-table" id="products-table"></table></div>
        </section>

        <section data-panel="pending-products" class="dash-panel">
          <h2>Seller products awaiting approval</h2>
          <div class="table-wrap"><table class="dash-table" id="pending-table"></table></div>
        </section>

        <section data-panel="sellers" class="dash-panel">
          <h2>Sellers</h2>
          <div class="table-wrap"><table class="dash-table" id="sellers-table"></table></div>
        </section>

        <section data-panel="customers" class="dash-panel">
          <h2>Customers</h2>
          <div class="table-wrap"><table class="dash-table" id="customers-table"></table></div>
        </section>

        <section data-panel="orders" class="dash-panel">
          <h2>Orders</h2>
          <div class="table-wrap"><table class="dash-table" id="orders-table"></table></div>
        </section>

        <section data-panel="categories" class="dash-panel">
          <div class="dash-toolbar">
            <h2>Categories</h2>
          </div>
          <form id="category-form" class="dash-inline-form">
            <label class="visually-hidden" for="cat-name">Name</label>
            <input id="cat-name" placeholder="Category name" required>
            <label class="visually-hidden" for="cat-slug">Slug</label>
            <input id="cat-slug" placeholder="slug-e.g-mobile" required>
            <button type="submit" class="btn btn-primary">Add category</button>
          </form>
          <div class="table-wrap"><table class="dash-table" id="categories-table"></table></div>
        </section>
      </div>
    </div>
  </div>

  <dialog id="product-dialog" class="dash-dialog">
    <form method="dialog" id="product-form" class="auth-form">
      <h2 id="product-dialog-title">Product</h2>
      <input type="hidden" id="pf-id">
      <p><label for="pf-name">Name</label><input id="pf-name" required></p>
      <p><label for="pf-desc">Description</label><textarea id="pf-desc" rows="3" required></textarea></p>
      <p><label for="pf-category">Category slug</label><input id="pf-category" required placeholder="mobile"></p>
      <p><label for="pf-sub">Subcategory</label><input id="pf-sub"></p>
      <p><label for="pf-price">Selling price</label><input id="pf-price" type="number" min="0" step="1" required></p>
      <p><label for="pf-original">Original price</label><input id="pf-original" type="number" min="0" step="1"></p>
      <p><label for="pf-discount">Discount label</label><input id="pf-discount"></p>
      <p><label for="pf-stock">Stock</label><input id="pf-stock" type="number" min="0" step="1" required></p>
      <p><label for="pf-image">Image URL</label><input id="pf-image" placeholder="https://… or upload below"></p>
      <p>
        <label for="pf-file">Upload image</label>
        <input id="pf-file" type="file" accept="image/*">
      </p>
      <p>
        <label for="pf-availability">Availability</label>
        <select id="pf-availability">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </p>
      <p class="form-errors" id="pf-errors" hidden></p>
      <div class="dash-dialog-actions">
        <button type="submit" class="btn btn-primary" value="save" id="pf-save">Save</button>
        <button type="button" class="btn" id="pf-cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <script src="js/api.js"></script>
  <script src="admin.js"></script>
</body>
</html>
